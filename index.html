    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Sepia",
        "alternateName": "Sepia Air Instruments",
        "url": "https://sepia.website/",
        "description": "Raise a finger and hear a chord. Play 120 instruments through your camera with real-time hand tracking, entirely in your browser. No install, no account.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern browser with camera access and WebAssembly.",
        "image": "https://sepia.website/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Mohsin Belam" },
        "isAccessibleForFree": true
      }
    </script>
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('sepia-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff');
      })();
    </script>
    <style>
      html, body, #root { margin: 0; min-height: 100%; }
      html { background: #fff; }
      html[data-theme='dark'] { background: #000; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;">

          <p style="margin:0;opacity:0.7;">Sepia runs in your browser. Turn on JavaScript and reload the page to play.</p>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
